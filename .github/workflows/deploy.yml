name: Deploy Static Site
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install
      run: |
        cd web
        npm ci
    - name: Build
      run: |
        cd web
        npm run build
    - name: Export Static
      run: |
        cd web
        npm run export
    - name: Deploy
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./web/out
        publish_branch: gh-pages
        force_orphan: true
EOF\
