name: Deploy .next
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install
      run: |
        cd web
        npm ci
    - name: Build
      run: |
        cd web
        npm run build
    - name: Deploy .next
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: web/.next
        branch: gh-pages
        clean: true
